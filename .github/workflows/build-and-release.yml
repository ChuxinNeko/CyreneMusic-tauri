name: Build and Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current version
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check if version changed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RELEASE=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          PREV_VERSION=${LATEST_RELEASE#v}
          CURR_VERSION=$(jq -r .version package.json)
          if [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $PREV_VERSION -> $CURR_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $CURR_VERSION"
          fi

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    needs: check-version
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz

  build-linux:
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  build-android:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Configure Cargo for Android cross-compilation
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/27.0.12077973"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > src-tauri/.cargo/config.toml << EOF
          [env]
          NDK_HOME = "$NDK_PATH"
          ANDROID_NDK_HOME = "$NDK_PATH"
          ANDROID_HOME = "$ANDROID_HOME"
          CC_aarch64-linux-android = "$TOOLCHAIN/aarch64-linux-android35-clang"
          AR_aarch64-linux-android = "$TOOLCHAIN/llvm-ar"

          [target.aarch64-linux-android]
          linker = "$TOOLCHAIN/aarch64-linux-android35-clang"

          [target.armv7-linux-androideabi]
          linker = "$TOOLCHAIN/armv7a-linux-androideabi35-clang"

          [target.i686-linux-android]
          linker = "$TOOLCHAIN/i686-linux-android35-clang"

          [target.x86_64-linux-android]
          linker = "$TOOLCHAIN/x86_64-linux-android35-clang"
          EOF

      - name: Fix Gradle properties for CI
        run: sed -i '/org.gradle.java.home/d' src-tauri/gen/android/gradle.properties

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Decode keystore and create signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/release.keystore
          cat > src-tauri/gen/android/keystore.properties << EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android APK
        run: bun run tauri android build --apk --split-per-abi
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Rename APKs
        run: |
          mkdir -p android-apks
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "app-*-release.apk"); do
            filename=$(basename "$apk")
            newname=$(echo "$filename" | sed -E 's/app-(.*)-release\.apk/CyreneMusicNext_${{ needs.check-version.outputs.version }}_\1.apk/')
            mv "$apk" "android-apks/$newname"
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-apks/*.apk

  build-ios:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Symlink bun for Xcode
        run: sudo ln -s $(which bun) /usr/local/bin/bun

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Build iOS unsigned
        run: |
          # 1. 构建前端静态资源 (Next.js 导出到 out 目录)
          bun run build
          
          # 2. 初始化 iOS 项目模板
          bun run tauri ios init || true
          
          # 3. 使用 Bun 脚本禁用 Xcode 项目中的签名限制，强制配置为 Manual / No Sign
          bun -e "
          const fs = require('fs');
          const path = require('path');
          const genAppleDir = path.join(process.cwd(), 'src-tauri', 'gen', 'apple');
          const projectDir = fs.readdirSync(genAppleDir).find(f => f.endsWith('.xcodeproj'));
          if (!projectDir) throw new Error('No .xcodeproj found');
          const pbxprojPath = path.join(genAppleDir, projectDir, 'project.pbxproj');
          let content = fs.readFileSync(pbxprojPath, 'utf8');
          const settingsToInject = '\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tENTITLEMENTS_REQUIRED = NO;';
          content = content.replace(/buildSettings = \{/g, 'buildSettings = {' + settingsToInject);
          fs.writeFileSync(pbxprojPath, content, 'utf8');
          console.log('Successfully disabled code signing in pbxproj!');
          "
          
          # 4. 运行官方 tauri ios build 编译。由于禁用了签名，底层编译能完美通过。
          # 加上 || true 确保即使在最终的 ipa 导出打包阶段遇到证书警告报错，也不会导致 CI 崩溃。
          bun run tauri ios build || true
          
          # 5. 进入构建工程目录，提取生成的 .app 并打包为未签名的 .ipa 格式
          cd src-tauri/gen/apple
          
          # 递归搜寻刚刚编译生成的 Release-iphoneos 目录下的 .app 文件
          APP_PATH=$(find . -name "*.app" -path "*/Release-iphoneos/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            # 备用方案：如果在 Release-iphoneos 中没找到，就搜寻任意的 .app
            APP_PATH=$(find . -name "*.app" | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "Found compiled app at: $APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r CyreneMusicNext.ipa Payload
          else
            echo "Error: No compiled .app found! Build might have failed."
            exit 1
          fi

      - name: Rename IPA
        run: |
          mkdir -p ios-ipa
          mv src-tauri/gen/apple/CyreneMusicNext.ipa ios-ipa/CyreneMusicNext_${{ needs.check-version.outputs.version }}.ipa

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios-ipa/*.ipa

  release:
    needs: [check-version, build-windows, build-macos, build-linux, build-android, build-ios]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: CyreneMusicNext v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          body: |
            
          files: |
            artifacts/windows-installers/**/*
            artifacts/macos-installers-*/**/*
            artifacts/linux-installers/**/*
            artifacts/android-apk/**/*
            artifacts/ios-ipa/**/*